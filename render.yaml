services:
  - type: web
    name: cybertrace-ai-api
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: CYBERTRACE_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cybertrace-ai-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://cybertrace-ai-web.onrender.com

  - type: web
    name: cybertrace-ai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://cybertrace-ai-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cybertrace-ai-db
    region: oregon
    plan: 0.1c-256mb
    diskSizeGB: 1