services:
  - type: web
    name: cybertrace-ai-api
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: CYBERTRACE_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cybertrace-ai-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: cybertrace-ai-db
    region: oregon
    plan: free